<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm món ăn</title>
</head>
<body>
    <h2>Tìm kiếm món ăn</h2>
    
    <form>
        <label>Nhóm món ăn:</label>
        <select>
            <option value="">-- Tất cả --</option>

        <button type="submit">Tìm kiếm</button>
    </form>
</body>
</html>
